name: Rebuild search pages

on:
  push:
    branches: [main]
    paths: ["index.html", "world.js", "teams.js", "data/series/**", "tools/build-pages.mjs", "tools/make-share-images.py", "tools/track-guides.mjs", "tools/check-site.mjs"]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1
      - name: Install Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Build pages
        run: node tools/build-pages.mjs
      - name: Race share images (only changed cards), then rebuild so pages link them
        run: python tools/make-share-images.py && node tools/build-pages.mjs
      - name: Check every section for out-of-date data
        run: node tools/check-site.mjs --write > /dev/null
      - name: Save if anything changed
        run: |
          git add -A icons/races races series tracks calendar/index.html watch tickets texas races-in about privacy terms 404.html sitemap.xml robots.txt hero.js llms.txt index.html STATUS.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git commit -m "Rebuild search pages"
          # Several robots save at the same moment; retry a few times instead of failing
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
