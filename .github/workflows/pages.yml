name: Rebuild search pages

on:
  push:
    branches: [main]
    paths: ["index.html", "world.js", "tools/build-pages.mjs"]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: node tools/build-pages.mjs
      - name: Save if anything changed
        run: |
          git add -A races series tracks calendar/index.html watch tickets texas races-in about privacy 404.html sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git commit -m "Rebuild search pages"
          # Several robots save at the same moment; retry a few times instead of failing
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
