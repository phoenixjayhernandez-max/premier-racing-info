name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines
        run: node tools/fetch-news.mjs
      - name: Save if anything changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add news.json
            git commit -m "Update news"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes"
          fi
