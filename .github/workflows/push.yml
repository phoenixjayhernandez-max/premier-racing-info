name: Send notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification to every phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Send
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          PUSH_TEST: ${{ inputs.test }}
        run: node tools/send-push.mjs
      - name: Remember what was sent
        run: |
          if [ -n "$(git status --porcelain push-state.json)" ]; then
            git config user.name "push-bot"
            git config user.email "push-bot@users.noreply.github.com"
            git add push-state.json
            git commit -m "Update notification log"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
